# STRATA ASCENT(Capacitor)の iOS ビルド → TestFlight 配布。
# 前提: Codemagic 側に App Store Connect 連携「Pocket Agent ASC」が設定済みで、
# コード署名はその連携キーで自動取得する。連携名が違う場合は environment の参照を合わせる。
workflows:
  ios-testflight:
    name: STRATA ASCENT iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Pocket Agent ASC
    environment:
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
    scripts:
      - name: 依存関係のインストール
        script: npm ci
      - name: Web ビルドと Capacitor 同期
        script: |
          npm run build
          npx cap sync ios
      - name: アイコンとスプラッシュの生成
        script: |
          # バイナリ画像は GitHub 連携の都合でリポジトリに置けないため、ビルド時に生成する
          echo "" | base64 --decode > "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do
            sips -z 2732 2732 "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" --out "ios/App/App/Assets.xcassets/Splash.imageset/$f" > /dev/null
          done
      - name: 署名の初期化
        script: keychain initialize
      - name: 署名情報の取得
        script: |
          app-store-connect fetch-signing-files "com.strataascent.app" \
            --type IOS_APP_STORE --create
      - name: 署名の適用
        script: keychain add-certificates
      - name: プロファイルの適用
        script: xcode-project use-profiles
      - name: IPA のビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
