# STRATA ASCENT(Capacitor)の iOS ビルド → TestFlight 配布。
# 署名は Pocket Agent / MUSICAGE と同じ実績方式: ビルド中に API で署名ファイルを
# 作らず、Codemagic のアプリ設定(Settings -> Code signing identities)に保存済みの
# 証明書・プロファイルを environment.ios_signing が選ぶだけ。
# 前提: App Store Connect 連携「Pocket Agent ASC」、Code signing identities に
# Apple Distribution 証明書とプロファイル「STRATA ASCENT App Store」を用意しておくこと。
workflows:
  ios-testflight:
    name: STRATA ASCENT iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Pocket Agent ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.strataascent.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: "6830440859"
      node: 22
    scripts:
      - name: 依存関係のインストール
        script: npm ci
      - name: Web ビルドと Capacitor 同期
        script: |
          npm run build
          npx cap sync ios
      - name: アイコンとスプラッシュの生成
        script: |
          # バイナリ画像は GitHub 連携の都合でリポジトリに置けないため、ビルド時に生成する
          echo "" | base64 --decode > "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          for f in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do
            sips -z 2732 2732 "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" --out "ios/App/App/Assets.xcassets/Splash.imageset/$f" > /dev/null
          done
      - name: プロファイルの適用
        script: xcode-project use-profiles
      - name: ビルド番号の設定
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: IPA のビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
