<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>STRATA ASCENT</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #000;
      /* ゲーム画面全体でテキスト/範囲選択と長押しコールアウトを禁止する
         (ドラッグ照準やボタンの長押しで画面が選択されて青くなるのを防ぐ) */
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 10px;
      color: #9aa4ad; font: 12px monospace; letter-spacing: 0.2em;
      pointer-events: none; user-select: none;
    }
    /* 通過演出の字幕(§6.5)。HUD と同じ等幅、文字間 0.3em。不透明度は src/render/caption.ts が毎フレーム更新 */
    #caption {
      position: fixed; left: 0; right: 0; bottom: 18%; text-align: center;
      color: #c8d0d6; font: 16px monospace; letter-spacing: 0.3em; opacity: 0;
      pointer-events: none; user-select: none;
    }
    /* タッチ操作ボタン(src/core/touch.ts が組み立てる)。タッチ端末(pointer: coarse)でのみ表示 */
    #touch { display: none; }
    @media (pointer: coarse) {
      #touch { display: block; }
      .tcluster {
        position: fixed; bottom: calc(12px + env(safe-area-inset-bottom));
        display: flex; gap: 12px;
        pointer-events: none; z-index: 10;
      }
      .tcluster.left { left: 12px; flex-direction: column; gap: 8px; }
      .tcluster.right { right: 12px; flex-direction: column; gap: 8px; align-items: flex-end; }
      .trow { display: flex; gap: 10px; }
      /* 梯子ボタンは梯子のそばにいる間だけ出す(main が #touch.ladder-on を切り替える)。
         パルス発射中(touch が #touch.pulse-on を付ける)も上・斜め狙い用に出す */
      .trow.ladder { display: none; }
      #touch.ladder-on .trow.ladder, #touch.pulse-on .trow.ladder { display: flex; }
      /* 溜め中は移動クラスタを落として無効化する(止まって狙うモードの明示) */
      #touch.aiming .tcluster.left { opacity: 0.25; }
      #touch.aiming .tcluster.left .tbtn { pointer-events: none; }
      .tview {
        position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px;
        pointer-events: none; z-index: 10;
      }
      .tbtn {
        pointer-events: auto; border-radius: 50%;
        background: rgba(28, 34, 40, 0.45); color: #c8d0d6;
        border: 1px solid rgba(200, 208, 214, 0.4);
        font: 24px monospace; touch-action: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      .tbtn.on { background: rgba(130, 150, 165, 0.55); }
      /* キャンセル圏内での予告色 */
      .tbtn.cancel-armed { background: rgba(170, 60, 60, 0.55); border-color: rgba(255, 130, 130, 0.7); }
      .sz-move { width: 74px; height: 74px; }
      .sz-ladder { width: 64px; height: 64px; font-size: 20px; }
      .sz-jump { width: 84px; height: 84px; font-size: 26px; }
      .sz-cannon { width: 76px; height: 76px; font-size: 22px; }
      .sz-pulse { width: 76px; height: 76px; font-size: 22px; }
      .sz-view { width: 48px; height: 48px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="caption"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
