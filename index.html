<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>STRATA ASCENT</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 10px;
      color: #9aa4ad; font: 12px monospace; letter-spacing: 0.2em;
      pointer-events: none; user-select: none;
    }
    /* 通過演出の字幕(§6.5)。HUD と同じ等幅、文字間 0.3em。不透明度は src/render/caption.ts が毎フレーム更新 */
    #caption {
      position: fixed; left: 0; right: 0; bottom: 18%; text-align: center;
      color: #c8d0d6; font: 16px monospace; letter-spacing: 0.3em; opacity: 0;
      pointer-events: none; user-select: none;
    }
    /* タッチ操作ボタン(src/core/touch.ts が組み立てる)。タッチ端末(pointer: coarse)でのみ表示 */
    #touch { display: none; }
    @media (pointer: coarse) {
      #touch { display: block; }
      .tcluster {
        position: fixed; bottom: calc(18px + env(safe-area-inset-bottom));
        display: flex; flex-wrap: wrap; gap: 12px;
        pointer-events: none; z-index: 10;
      }
      .tcluster.left { left: 16px; }
      .tcluster.right { right: 16px; width: 172px; justify-content: flex-end; }
      .tbtn {
        pointer-events: auto; width: 80px; height: 80px; border-radius: 50%;
        background: rgba(28, 34, 40, 0.45); color: #c8d0d6;
        border: 1px solid rgba(200, 208, 214, 0.4);
        font: 24px monospace; touch-action: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      .tbtn.on { background: rgba(130, 150, 165, 0.55); }
      /* 浮動スティック(src/core/touch.ts)。左半分=移動、右半分=エイムのレイヤーが受け、
         土台とノブを触った点へ出す */
      .stick-layer { position: fixed; top: 0; bottom: 0; width: 50%; z-index: 5; touch-action: none; }
      .stick-layer.left { left: 0; }
      .stick-layer.right { right: 0; }
      .stick-base {
        display: none; position: fixed; width: 112px; height: 112px;
        margin: -56px 0 0 -56px; border-radius: 50%;
        border: 1px solid rgba(200, 208, 214, 0.35); background: rgba(28, 34, 40, 0.3);
        pointer-events: none;
      }
      .stick-knob {
        position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
        margin: -26px 0 0 -26px; border-radius: 50%;
        background: rgba(130, 150, 165, 0.45);
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="caption"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
